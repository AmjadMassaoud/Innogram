services:
  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      args:
        APP_NAME: api-gateway
    command: npm run start:prod:api-gateway
    ports:
      - '3002:3002'
    env_file:
      - './apps/api-gateway/.env.development'
    depends_on:
      - auth-service
    environment:
      - NODE_ENV=production

  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      args:
        APP_NAME: auth-service
    ports:
      - '4000:4000'
    env_file:
      - './apps/auth-service/.env'
    depends_on:
      - mongodb
      - redis
    environment:
      - NODE_ENV=production

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - ./mongo-data:/data/db
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - ./redis-data:/data

volumes:
  mongo-data:
  redis-data:

networks:
  default:
    name: innogram-net
    driver: bridge
    external: true
